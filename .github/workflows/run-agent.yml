name: Autonomous Export & Reply Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *' # Automatically runs daily at 9:00 AM UTC

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Lead Outreach Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DRY_RUN: "false"
        run: |
          python outreach.py

      - name: Run Automated Reply Handler
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python reply_agent.py

      - name: Upload Campaign Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: campaign-results
          path: campaign_results.json
